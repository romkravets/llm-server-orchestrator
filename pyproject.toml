[project]
name = "history-agent"
version = "0.1.0"
description = "LangGraph implementation agent for the history repo, with a human-approval gate before merging."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-ollama>=0.2.2",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
